services:
  - type: web
    name: telegram-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DESTINATIONS
        sync: false
      - key: MCP_AUTH_ENABLED
        value: "true"
      - key: MCP_AUTH_ISSUER_URL
        sync: false
      - key: MCP_PUBLIC_URL
        value: https://telegram-mcp-hk2e.onrender.com/mcp
      - key: MCP_AUTH_AUDIENCE
        value: https://telegram-mcp-hk2e.onrender.com/mcp
      - key: MCP_AUTH_REQUIRED_SCOPES
        value: telegram:send
      - key: TELEGRAM_AUTO_PUBLISH_DESTINATION
        value: main
      - key: TELEGRAM_SEND_RATE_LIMIT_PER_MINUTE
        value: "12"
